# Kubernetes smoke test for the accounting add-on: one pod running the wrapper image
# (deploy/Dockerfile) with the smoke-test configuration on a throwaway volume.
# NOT a production manifest: data is an emptyDir, and the config grants the admin
# the treasurer's money permissions (deploy/smoke/app-custom-config.json).
#
#   kubectl apply -f deploy/k8s/smoke.yaml        # after creating the secret and configmap below
#   kubectl -n ngdp-accounting-smoke port-forward svc/ngdp 3012:3000
#   scripts/smoke.sh http://localhost:3012 "<admin password>"
#
# Created first, so no secret lands in git:
#   kubectl create namespace ngdp-accounting-smoke
#   kubectl -n ngdp-accounting-smoke create secret generic ngdp-secrets \
#     --from-literal=NGDPBASE_ADMIN_PASSWORD=... --from-literal=NGDPBASE_DATABASE_KEY=... \
#     --from-literal=NGDPBASE_SESSION_SECRET=...
#   kubectl -n ngdp-accounting-smoke create configmap ngdp-smoke-config \
#     --from-file=app-custom-config.json=deploy/smoke/app-custom-config.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngdp
  namespace: ngdp-accounting-smoke
spec:
  replicas: 1
  selector:
    matchLabels: { app: ngdp }
  template:
    metadata:
      labels: { app: ngdp }
    spec:
      # Alpine (musl) and Kubernetes' default ndots:5 misresolve external names (ngdpbase deployment notes).
      dnsConfig:
        options: [{ name: ndots, value: "1" }]
      initContainers:
        # Application config lives on the data volume, never mounted read-only (ngdpbase kubernetes.md).
        - name: seed-config
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /app/data/config && cp /seed/app-custom-config.json /app/data/config/"]
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: seed, mountPath: /seed }
      containers:
        - name: ngdp
          image: ngdp-accounting:smoke
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "1000" }
            - { name: HEADLESS_INSTALL, value: "true" }
            - { name: NGDPBASE_HOST, value: "0.0.0.0" }
            - { name: NGDPBASE_BASE_URL, value: "http://localhost:3012" }
          envFrom:
            - secretRef: { name: ngdp-secrets }
          volumeMounts:
            - { name: data, mountPath: /app/data }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - { name: data, emptyDir: {} }
        - { name: seed, configMap: { name: ngdp-smoke-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: ngdp
  namespace: ngdp-accounting-smoke
spec:
  selector: { app: ngdp }
  ports: [{ port: 3000, targetPort: 3000 }]
